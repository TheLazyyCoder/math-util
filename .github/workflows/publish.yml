name: Publish Package to npm

on:
  release:
    types: [published] # Triggers when you create a formal GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    
    # Required permissions for Trusted Publishing / OpenID Connect
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance
